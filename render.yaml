# Arth API — long-running Node service (SQLite + SSE market feed).
# The React client deploys separately to Vercel and points at this URL via VITE_API_BASE.

services:
  - type: web
    name: arth-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: COOKIE_SAMESITE
        value: none
      - key: SEED_DEMO
        value: "true"
