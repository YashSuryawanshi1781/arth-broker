# Arth API — long-running Node service (SQLite + SSE market feed).
# The React client deploys to Vercel and proxies /api here, so session
# cookies stay first-party on the Vercel domain.

services:
  - type: web
    name: arth-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://arth-broker.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: SEED_DEMO
        value: "true"
